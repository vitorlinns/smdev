<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Smdev | SMTP local para devs</title>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/brand/logo-smdev.png" alt="smdev" />
      </div>
      <button id="clear-all" class="danger">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="currentColor">
          <path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z" />
        </svg>
        Limpar tudo
      </button>
    </header>

    <main class="layout">
      <aside class="message-list">
        <div class="list-filters">
          <button class="filter-btn active" data-filter="all">Todos</button>
          <button class="filter-btn" data-filter="unread">Não lidos</button>
        </div>
        <ul id="message-list"></ul>
        <div id="empty-state" class="empty-state" hidden>
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
            <path
              d="M3.5 6.5h17a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-17a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"
              fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            <path d="m3 7 9 6.5L21 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <p>Nenhum email ainda.<br />Envie um SMTP pra <code>localhost:1025</code>.</p>
        </div>
      </aside>

      <section class="message-detail" id="message-detail">
        <div class="placeholder">
          <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
            <path
              d="M3.5 6.5h17a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-17a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"
              fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            <path d="m3 7 9 6.5L21 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <p>Selecione um email na lista à esquerda.</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
