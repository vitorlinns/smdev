services:
  smdev:
    build: .
    container_name: smdev
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      SMTP_PORT: ${SMTP_PORT:-1025}
      HTTP_PORT: ${HTTP_PORT:-8025}
      INBOX_MAX_MESSAGES: ${INBOX_MAX_MESSAGES:-200}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:$$HTTP_PORT/api/messages || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - mailnet

networks:
  mailnet:
    external: true
